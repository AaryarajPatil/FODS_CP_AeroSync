<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e5e6e8, #84a7e4, #66a2ea);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.3s;
        }

        .menu-btn:hover {
            background: #3498db;
            transform: translateX(5px);
        }

        .menu-btn.active {
            background: #6b9ce0;
        }

        .content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            min-height: 600px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        .flight-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3498db;
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .flight-number {
            font-weight: bold;
            font-size: 1.2rem;
            color: #2c3e50;
        }

        .flight-destination {
            font-size: 1.1rem;
            color: #3cb1e7;
        }

        .flight-details {
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
        }

        .passenger-list {
            margin-top: 15px;
        }

        .passenger-item {
            background: #f8f9fa;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }

        .stats-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #6cdae9;
            border-radius: 10px;
            transition: width 0.5s;
        }

        .alert {
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #70d4e6;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f1f1f1;
            color: #80eee8;
            border: 1px solid #f8f7f7;
        }

        .search-box {
            display: flex;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            margin-right: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-danger {
            background: #7fcfe6;
        }

        .btn-danger:hover {
            background: #83e6e7;
        }

        .btn-success {
            background: #6eccd1;
        }

        .btn-success:hover {
            background: #70b6de;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ Flight Management System</h1>
            <p class="subtitle">Complete Airline Attendance and Passenger Tracking Solution</p>
        </header>

        <div class="dashboard">
            <div class="sidebar">
                <button class="menu-btn active" data-section="dashboard">📊 Dashboard</button>
                <button class="menu-btn" data-section="flights">✈️ View Flights</button>
                <button class="menu-btn" data-section="add-flight">➕ Add Flight</button>
                <button class="menu-btn" data-section="attendance">✅ Mark Attendance</button>
                <button class="menu-btn" data-section="passengers">👥 View Passengers</button>
                <button class="menu-btn" data-section="search">🔍 Search Flights</button>
                <button class="menu-btn" data-section="delete-flight">🗑️ Delete Flight</button>
                <button class="menu-btn" data-section="cancel-passenger">❌ Cancel Booking</button>
                <button class="menu-btn" data-section="sort-flights">⏱️ Sort Flights</button>
                <button class="menu-btn" data-section="statistics">📈 Statistics</button>
            </div>
            <div class="content">
                <!-- Dashboard Section -->
                <div id="dashboard" class="section active">
                    <h2>Dashboard Overview</h2>
                    <div class="stats-grid">
                        <div class="stats-card">
                            <h3>Total Flights</h3>
                            <p id="total-flights">0</p>
                        </div>
                        <div class="stats-card">
                            <h3>Total Passengers</h3>
                            <p id="total-passengers">0</p>
                        </div>
                        <div class="stats-card">
                            <h3>Average Occupancy</h3>
                            <p id="avg-occupancy">0%</p>
                        </div>
                    </div>
                    
                    <h3 style="margin-top: 30px;">Recent Flights</h3>
                    <div id="recent-flights">
                        <!-- Recent flights will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Add Flight Section -->
                <div id="add-flight" class="section">
                    <h2>Add New Flight</h2>
                    <div class="form-group">
                        <label for="flight-number">Flight Number</label>
                        <input type="text" id="flight-number" placeholder="e.g., AA123">
                    </div>
                    <div class="form-group">
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" placeholder="e.g., New York">
                    </div>
                    <div class="form-group">
                        <label for="departure-time">Departure Time</label>
                        <input type="text" id="departure-time" placeholder="e.g., 14:30">
                    </div>
                    <div class="form-group">
                        <label for="total-seats">Total Seats</label>
                        <input type="number" id="total-seats" placeholder="e.g., 150">
                    </div>
                    <button id="add-flight-btn">Add Flight</button>
                    <div id="add-flight-message"></div>
                </div>

                <!-- View Flights Section -->
                <div id="view-flights" class="section">
                    <h2>All Flights</h2>
                    <div class="search-box">
                        <input type="text" id="flight-search" placeholder="Search flights...">
                        <button id="search-flight-btn">Search</button>
                    </div>
                    <div id="flights-list">
                        <!-- Flights will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Mark Attendance Section -->
                <div id="mark-attendance" class="section">
                    <h2>Mark Passenger Attendance</h2>
                    <div class="form-group">
                        <label for="attendance-flight">Select Flight</label>
                        <select id="attendance-flight">
                            <option value="">-- Select a Flight --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="passenger-name">Passenger Name</label>
                        <input type="text" id="passenger-name" placeholder="Full name">
                    </div>
                    <div class="form-group">
                        <label for="passenger-age">Age</label>
                        <input type="number" id="passenger-age" placeholder="Age">
                    </div>
                    <div class="form-group">
                        <label for="seat-number">Seat Number</label>
                        <input type="text" id="seat-number" placeholder="e.g., 12A">
                    </div>
                    <button id="mark-attendance-btn">Mark Attendance</button>
                    <div id="attendance-message"></div>
                </div>

                <!-- View Passengers Section -->
                <div id="view-passengers" class="section">
                    <h2>View Passengers</h2>
                    <div class="form-group">
                        <label for="passengers-flight">Select Flight</label>
                        <select id="passengers-flight">
                            <option value="">-- Select a Flight --</option>
                        </select>
                    </div>
                    <div id="passengers-list">
                        <!-- Passengers will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Search Flight Section -->
                <div id="search-flight" class="section">
                    <h2>Search Flight</h2>
                    <div class="form-group">
                        <label for="search-query">Flight Number or Destination</label>
                        <input type="text" id="search-query" placeholder="Enter flight number or destination">
                    </div>
                    <button id="search-btn">Search</button>
                    <div id="search-results">
                        <!-- Search results will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Statistics Section -->
                <div id="statistics" class="section">
                    <h2>Flight Statistics</h2>
                    <div id="statistics-content">
                        <!-- Statistics will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample initial data
        let flights = [
            {
                flightNumber: "AA101",
                destination: "New York",
                departureTime: "08:00",
                totalSeats: 150,
                bookedSeats: 45,
                passengers: [
                    { name: "John Smith", age: 35, seat: "12A" },
                    { name: "Emma Johnson", age: 28, seat: "15B" }
                ]
            },
            {
                flightNumber: "UA202",
                destination: "Los Angeles",
                departureTime: "10:30",
                totalSeats: 200,
                bookedSeats: 120,
                passengers: [
                    { name: "Michael Brown", age: 42, seat: "8C" },
                    { name: "Sarah Davis", age: 31, seat: "22D" }
                ]
            },
            {
                flightNumber: "DL303",
                destination: "Miami",
                departureTime: "14:15",
                totalSeats: 180,
                bookedSeats: 90,
                passengers: [
                    { name: "Robert Wilson", age: 55, seat: "5A" }
                ]
            }
        ];

        // DOM Elements
        const menuButtons = document.querySelectorAll('.menu-btn');
        const sections = document.querySelectorAll('.section');

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            // Set up menu navigation
            menuButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetSection = this.getAttribute('data-section');
                    
                    // Update active menu button
                    menuButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Show target section
                    sections.forEach(section => section.classList.remove('active'));
                    document.getElementById(targetSection).classList.add('active');
                    
                    // Refresh data if needed
                    if (targetSection === 'dashboard') {
                        updateDashboard();
                    } else if (targetSection === 'view-flights') {
                        displayFlights();
                    } else if (targetSection === 'statistics') {
                        displayStatistics();
                    }
                });
            });

            // Initialize flight dropdowns
            updateFlightDropdowns();
            
            // Set up event listeners
            document.getElementById('add-flight-btn').addEventListener('click', addFlight);
            document.getElementById('mark-attendance-btn').addEventListener('click', markAttendance);
            document.getElementById('search-btn').addEventListener('click', searchFlights);
            document.getElementById('search-flight-btn').addEventListener('click', searchFlightsInList);
            document.getElementById('passengers-flight').addEventListener('change', displayPassengers);
            
            // Initial data display
            updateDashboard();
            displayFlights();
        });

        // Update dashboard with current data
        function updateDashboard() {
            const totalFlights = flights.length;
            const totalPassengers = flights.reduce((sum, flight) => sum + flight.bookedSeats, 0);
            const avgOccupancy = flights.length > 0 
                ? Math.round(flights.reduce((sum, flight) => sum + (flight.bookedSeats / flight.totalSeats), 0) / flights.length * 100)
                : 0;
            
            document.getElementById('total-flights').textContent = totalFlights;
            document.getElementById('total-passengers').textContent = totalPassengers;
            document.getElementById('avg-occupancy').textContent = `${avgOccupancy}%`;
            
            // Display recent flights (last 3)
            const recentFlightsContainer = document.getElementById('recent-flights');
            recentFlightsContainer.innerHTML = '';
            
            if (flights.length === 0) {
                recentFlightsContainer.innerHTML = `
                    <div class="empty-state">
                        <i>✈️</i>
                        <p>No flights available. Add your first flight to get started.</p>
                    </div>
                `;
                return;
            }
            
            const recentFlights = flights.slice(-3).reverse();
            recentFlights.forEach(flight => {
                const occupancyPercent = Math.round((flight.bookedSeats / flight.totalSeats) * 100);
                const flightCard = document.createElement('div');
                flightCard.className = 'flight-card';
                flightCard.innerHTML = `
                    <div class="flight-header">
                        <span class="flight-number">${flight.flightNumber}</span>
                        <span class="flight-destination">${flight.destination}</span>
                    </div>
                    <div class="flight-details">
                        <span>Departure: ${flight.departureTime}</span>
                        <span>Seats: ${flight.bookedSeats}/${flight.totalSeats}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" style="width: ${occupancyPercent}%"></div>
                    </div>
                `;
                recentFlightsContainer.appendChild(flightCard);
            });
        }

        // Display all flights
        function displayFlights() {
            const flightsList = document.getElementById('flights-list');
            flightsList.innerHTML = '';
            
            if (flights.length === 0) {
                flightsList.innerHTML = `
                    <div class="empty-state">
                        <i>✈️</i>
                        <p>No flights available. Add your first flight to get started.</p>
                    </div>
                `;
                return;
            }
            
            flights.forEach(flight => {
                const occupancyPercent = Math.round((flight.bookedSeats / flight.totalSeats) * 100);
                const flightCard = document.createElement('div');
                flightCard.className = 'flight-card';
                flightCard.innerHTML = `
                    <div class="flight-header">
                        <span class="flight-number">${flight.flightNumber}</span>
                        <span class="flight-destination">${flight.destination}</span>
                    </div>
                    <div class="flight-details">
                        <span>Departure: ${flight.departureTime}</span>
                        <span>Seats: ${flight.bookedSeats}/${flight.totalSeats}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" style="width: ${occupancyPercent}%"></div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-danger" onclick="deleteFlight('${flight.flightNumber}')">Delete</button>
                    </div>
                `;
                flightsList.appendChild(flightCard);
            });
        }

        // Add a new flight
        function addFlight() {
            const flightNumber = document.getElementById('flight-number').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const departureTime = document.getElementById('departure-time').value.trim();
            const totalSeats = parseInt(document.getElementById('total-seats').value);
            
            if (!flightNumber || !destination || !departureTime || !totalSeats) {
                showMessage('add-flight-message', 'Please fill in all fields.', 'danger');
                return;
            }
            
            // Check if flight number already exists
            if (flights.some(flight => flight.flightNumber === flightNumber)) {
                showMessage('add-flight-message', 'Flight number already exists.', 'danger');
                return;
            }
            
            const newFlight = {
                flightNumber,
                destination,
                departureTime,
                totalSeats,
                bookedSeats: 0,
                passengers: []
            };
            
            flights.push(newFlight);
            updateFlightDropdowns();
            showMessage('add-flight-message', 'Flight added successfully!', 'success');
            
            // Clear form
            document.getElementById('flight-number').value = '';
            document.getElementById('destination').value = '';
            document.getElementById('departure-time').value = '';
            document.getElementById('total-seats').value = '';
        }

        // Mark passenger attendance
        function markAttendance() {
            const flightNumber = document.getElementById('attendance-flight').value;
            const passengerName = document.getElementById('passenger-name').value.trim();
            const passengerAge = parseInt(document.getElementById('passenger-age').value);
            const seatNumber = document.getElementById('seat-number').value.trim();
            
            if (!flightNumber || !passengerName || !passengerAge || !seatNumber) {
                showMessage('attendance-message', 'Please fill in all fields.', 'danger');
                return;
            }
            
            const flight = flights.find(f => f.flightNumber === flightNumber);
            if (!flight) {
                showMessage('attendance-message', 'Flight not found.', 'danger');
                return;
            }
            
            if (flight.bookedSeats >= flight.totalSeats) {
                showMessage('attendance-message', 'No available seats on this flight.', 'danger');
                return;
            }
            
            // Check if seat is already taken
            if (flight.passengers.some(p => p.seat === seatNumber)) {
                showMessage('attendance-message', 'Seat already taken.', 'danger');
                return;
            }
            
            const newPassenger = {
                name: passengerName,
                age: passengerAge,
                seat: seatNumber
            };
            
            flight.passengers.push(newPassenger);
            flight.bookedSeats++;
            
            showMessage('attendance-message', 'Passenger added successfully!', 'success');
            
            // Clear form
            document.getElementById('passenger-name').value = '';
            document.getElementById('passenger-age').value = '';
            document.getElementById('seat-number').value = '';
        }

        // Display passengers for selected flight
        function displayPassengers() {
            const flightNumber = document.getElementById('passengers-flight').value;
            const passengersList = document.getElementById('passengers-list');
            
            if (!flightNumber) {
                passengersList.innerHTML = '<p>Please select a flight.</p>';
                return;
            }
            
            const flight = flights.find(f => f.flightNumber === flightNumber);
            if (!flight) {
                passengersList.innerHTML = '<p>Flight not found.</p>';
                return;
            }
            
            if (flight.passengers.length === 0) {
                passengersList.innerHTML = `
                    <div class="empty-state">
                        <i>👥</i>
                        <p>No passengers booked on this flight.</p>
                    </div>
                `;
                return;
            }
            
            passengersList.innerHTML = '<h3>Passenger List</h3>';
            flight.passengers.forEach(passenger => {
                const passengerItem = document.createElement('div');
                passengerItem.className = 'passenger-item';
                passengerItem.innerHTML = `
                    <div>
                        <strong>${passenger.name}</strong><br>
                        Age: ${passenger.age} | Seat: ${passenger.seat}
                    </div>
                    <button class="btn-danger" onclick="cancelPassenger('${flightNumber}', '${passenger.name}')">Cancel</button>
                `;
                passengersList.appendChild(passengerItem);
            });
        }

        // Search flights
        function searchFlights() {
            const query = document.getElementById('search-query').value.trim().toLowerCase();
            const resultsContainer = document.getElementById('search-results');
            
            if (!query) {
                resultsContainer.innerHTML = '<p>Please enter a search term.</p>';
                return;
            }
            
            const matchingFlights = flights.filter(flight => 
                flight.flightNumber.toLowerCase().includes(query) || 
                flight.destination.toLowerCase().includes(query)
            );
            
            if (matchingFlights.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <i>🔍</i>
                        <p>No flights found matching your search.</p>
                    </div>
                `;
                return;
            }
            
            resultsContainer.innerHTML = '<h3>Search Results</h3>';
            matchingFlights.forEach(flight => {
                const occupancyPercent = Math.round((flight.bookedSeats / flight.totalSeats) * 100);
                const flightCard = document.createElement('div');
                flightCard.className = 'flight-card';
                flightCard.innerHTML = `
                    <div class="flight-header">
                        <span class="flight-number">${flight.flightNumber}</span>
                        <span class="flight-destination">${flight.destination}</span>
                    </div>
                    <div class="flight-details">
                        <span>Departure: ${flight.departureTime}</span>
                        <span>Seats: ${flight.bookedSeats}/${flight.totalSeats}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" style="width: ${occupancyPercent}%"></div>
                    </div>
                `;
                resultsContainer.appendChild(flightCard);
            });
        }

        // Search flights in the view flights section
        function searchFlightsInList() {
            const query = document.getElementById('flight-search').value.trim().toLowerCase();
            const flightCards = document.querySelectorAll('#flights-list .flight-card');
            
            flightCards.forEach(card => {
                const flightNumber = card.querySelector('.flight-number').textContent.toLowerCase();
                const destination = card.querySelector('.flight-destination').textContent.toLowerCase();
                
                if (flightNumber.includes(query) || destination.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Display statistics
        function displayStatistics() {
            const statsContainer = document.getElementById('statistics-content');
            statsContainer.innerHTML = '';
            
            if (flights.length === 0) {
                statsContainer.innerHTML = `
                    <div class="empty-state">
                        <i>📊</i>
                        <p>No flight data available for statistics.</p>
                    </div>
                `;
                return;
            }
            
            flights.forEach(flight => {
                const occupancyPercent = Math.round((flight.bookedSeats / flight.totalSeats) * 100);
                const statsCard = document.createElement('div');
                statsCard.className = 'stats-card';
                statsCard.innerHTML = `
                    <h3>${flight.flightNumber} → ${flight.destination}</h3>
                    <p>Seats Filled: ${flight.bookedSeats}/${flight.totalSeats} (${occupancyPercent}%)</p>
                    <div class="progress-bar">
                        <div class="progress" style="width: ${occupancyPercent}%"></div>
                    </div>
                `;
                statsContainer.appendChild(statsCard);
            });
        }

        // Delete a flight
        function deleteFlight(flightNumber) {
            if (confirm(`Are you sure you want to delete flight ${flightNumber}?`)) {
                flights = flights.filter(flight => flight.flightNumber !== flightNumber);
                updateFlightDropdowns();
                displayFlights();
                updateDashboard();
            }
        }

        // Cancel a passenger booking
        function cancelPassenger(flightNumber, passengerName) {
            if (confirm(`Cancel booking for ${passengerName}?`)) {
                const flight = flights.find(f => f.flightNumber === flightNumber);
                if (flight) {
                    flight.passengers = flight.passengers.filter(p => p.name !== passengerName);
                    flight.bookedSeats--;
                    displayPassengers();
                    updateDashboard();
                }
            }
        }

        // Update flight dropdowns in forms
        function updateFlightDropdowns() {
            const attendanceDropdown = document.getElementById('attendance-flight');
            const passengersDropdown = document.getElementById('passengers-flight');
            
            // Clear existing options (except the first placeholder)
            while (attendanceDropdown.children.length > 1) {
                attendanceDropdown.removeChild(attendanceDropdown.lastChild);
            }
            while (passengersDropdown.children.length > 1) {
                passengersDropdown.removeChild(passengersDropdown.lastChild);
            }
            
            // Add flight options
            flights.forEach(flight => {
                const option1 = document.createElement('option');
                option1.value = flight.flightNumber;
                option1.textContent = `${flight.flightNumber} → ${flight.destination}`;
                attendanceDropdown.appendChild(option1);
                
                const option2 = document.createElement('option');
                option2.value = flight.flightNumber;
                option2.textContent = `${flight.flightNumber} → ${flight.destination}`;
                passengersDropdown.appendChild(option2);
            });
        }

        // Show message with specified type (success/danger)
        function showMessage(elementId, message, type) {
            const messageElement = document.getElementById(elementId);
            messageElement.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            
            // Clear message after 3 seconds
            setTimeout(() => {
                messageElement.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
