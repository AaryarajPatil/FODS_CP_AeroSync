<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e5e6e8, #84a7e4, #66a2ea);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.3s;
        }

        .menu-btn:hover {
            background: #3498db;
            transform: translateX(5px);
        }

        .menu-btn.active {
            background: #6b9ce0;
        }

        .content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            min-height: 600px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        .flight-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3498db;
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .flight-number {
            font-weight: bold;
            font-size: 1.2rem;
            color: #2c3e50;
        }

        .flight-destination {
            font-size: 1.1rem;
            color: #3cb1e7;
        }

        .flight-details {
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
        }

        .passenger-list {
            margin-top: 15px;
        }

        .passenger-item {
            background: #f8f9fa;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }

        .stats-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #6cdae9;
            border-radius: 10px;
            transition: width 0.5s;
        }

        .alert {
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #70d4e6;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f1f1f1;
            color: #80eee8;
            border: 1px solid #f8f7f7;
        }

        .search-box {
            display: flex;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            margin-right: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-danger {
            background: #7fcfe6;
        }

        .btn-danger:hover {
            background: #83e6e7;
        }

        .btn-success {
            background: #6eccd1;
        }

        .btn-success:hover {
            background: #70b6de;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ Flight Management System</h1>
            <p class="subtitle">Complete Airline Attendance and Passenger Tracking Solution</p>
        </header>

        <div class="dashboard">
            <div class="sidebar">
                <button class="menu-btn active" data-section="dashboard">📊 Dashboard</button>
                <button class="menu-btn" data-section="flights">✈️ View Flights</button>
                <button class="menu-btn" data-section="add-flight">➕ Add Flight</button>
                <button class="menu-btn" data-section="attendance">✅ Mark Attendance</button>
                <button class="menu-btn" data-section="passengers">👥 View Passengers</button>
                <button class="menu-btn" data-section="search">🔍 Search Flights</button>
                <button class="menu-btn" data-section="delete-flight">🗑️ Delete Flight</button>
                <button class="menu-btn" data-section="cancel-passenger">❌ Cancel Booking</button>
                <button class="menu-btn" data-section="sort-flights">⏱️ Sort Flights</button>
                <button class="menu-btn" data-section="statistics">📈 Statistics</button>
            </div>
            <div class="content">
                <!-- Content sections -->
            </div>
        </div>
    </div>
</body>
</html>
